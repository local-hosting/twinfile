# Natural hazards → shared event units (catalog/event/examples).
# Power-outage is grid infrastructure but listed here for all-hazards playbooks.
# Out of scope v1: pandemic, hazmat spill, rip currents (see doc/kinds/natural-hazards.md).
version: 1
hazards:
  - id: avalanche
    title: Avalanche
    event: slope-movement
  - id: blizzard
    title: Blizzard
    event: severe-weather
  - id: coastal-flooding
    title: Coastal flooding / storm surge
    event: flood
  - id: dam-failure-flood
    title: Dam failure / controlled release
    event: dam-release
  - id: debris
    title: Debris / rubble
    event: field-damage
  - id: drought
    title: Drought
    event: drought
  - id: road-closure
    title: Road or path closure
    event: field-damage
  - id: structural-damage
    title: Structural damage
    event: field-damage
  - id: dust-storm
    title: Dust storm / haboob
    event: severe-weather
  - id: earthquake
    title: Earthquake
    event: earthquake
  - id: extreme-cold
    title: Extreme cold / cold wave
    event: severe-weather
  - id: extreme-heat
    title: Extreme heat
    event: severe-weather
  - id: flood
    title: Flood (river, pluvial)
    event: flood
  - id: hail
    title: Hail
    event: severe-weather
  - id: hurricane
    title: Hurricane / tropical cyclone
    event: severe-weather
  - id: lahar
    title: Lahar (volcanic mudflow)
    event: slope-movement
  - id: landslide
    title: Landslide / debris flow
    event: slope-movement
  - id: lightning
    title: Lightning
    event: severe-weather
  - id: power-outage
    title: Power outage (grid failure)
    event: power-outage
  - id: thunderstorm
    title: Severe thunderstorm
    event: severe-weather
  - id: tornado
    title: Tornado
    event: severe-weather
  - id: tsunami
    title: Tsunami
    event: tsunami
  - id: volcanic-eruption
    title: Volcanic eruption / ashfall
    event: volcanic-ash
  - id: wildfire
    title: Wildfire
    event: wildfire
  - id: winter-storm
    title: Winter storm / ice
    event: severe-weather
