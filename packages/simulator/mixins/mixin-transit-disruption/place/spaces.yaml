# Mixin spaces sit on level `ground` and carry visit_order so they pass stacked and sequenced bases.
spaces:
  - id: transit-disruption-stop
    name: Ground-transport stop
    kind: platform
    level: ground
    visit_order: 92
    exposure: covered
    roles:
      - ground-transport
  - id: transit-disruption-alternative
    name: Alternative pickup
    kind: zone
    level: ground
    visit_order: 93
    exposure: outdoor
    roles:
      - alternative
