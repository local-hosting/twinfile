    name: Severe-weather shelter
    kind: hall
    level: ground
    visit_order: 90
    exposure: indoor
    roles:
      - shelter
  - id: severe-weather-assembly
    name: Outdoor assembly area
    kind: plaza
    level: ground
    visit_order: 91
