# Open module types for declarative patch graphs (config + port shapes; no host runtime).
# Wire tiers: place:merged (= bundle.place), place:site, place:building (RFC 0005 anchor slice).
# Event types arrive on `twin:event` / `signal:*` wires (host context), not catalog modes.
module_types:
  twinfile/mod.map-sink@0.1.0:
    ports:
      in: { direction: in, wire: place:merged }
      building: { direction: in, wire: place:building }
      layer: { direction: out, wire: twin:layer }
  twinfile/mod.building-scope@0.1.0:
    ports:
      in: { direction: in, wire: place:merged, facet: internal }
      scoped: { direction: out, wire: place:building, facet: internal }
  twinfile/mod.site-scope@0.1.0:
    ports:
      in: { direction: in, wire: place:merged, facet: internal }
      scoped: { direction: out, wire: place:site, facet: internal }
  twinfile/mod.shelter-standup@0.1.0:
    ports:
      scenario: { direction: in, wire: scenario:args }
      metrics: { direction: out, wire: twin:metrics }
  twinfile/mod.bridge-import@0.1.0:
    ports:
      source: { direction: in, wire: bridge:source }
      place: { direction: out, wire: place:merged }
  twinfile/mod.event-in@0.1.0:
    ports:
      in: { direction: in, wire: twin:event }
      alert: { direction: out, wire: signal:alert }
      trigger: { direction: out, wire: signal:trigger }
  twinfile/mod.signal-hub@0.1.0:
    ports:
      rain: { direction: in, wire: signal:rain }
      alert: { direction: in, wire: signal:alert }
      rating: { direction: in, wire: signal:rating }
      volume: { direction: in, wire: signal:volume }
      open: { direction: in, wire: signal:open }
      trigger: { direction: in, wire: signal:trigger }
      status: { direction: out, wire: signal:status }
      occupancy: { direction: out, wire: signal:occupancy }
