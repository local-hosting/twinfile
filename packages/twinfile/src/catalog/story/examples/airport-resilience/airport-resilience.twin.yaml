twinfile: 2
kind: story
id: airport-resilience
name: Airport resilience
version: 0.1.0
stability: example
mode: resilience
links:
  - rel: involves
    href: twinfile/place/airport:0.2.0
  - rel: involves
    href: twinfile/character/airport-liaison:0.1.0
  - rel: involves
    href: twinfile/context/air-travel:0.1.0
story:
  pitch: Terminal shelter when severe weather closes the curb, then volcanic-ash advisory.
  scenes:
    - id: terminal-shelter
      label: Terminal shelter
      run:
        steps:
          - copy: twinfile/event/severe-weather:1.0.0
        args:
          occupancy: 2500
          target_role: shelter
          warningAt: severe-weather.warning
    - id: ashfall-advisory
      label: Ashfall advisory
      run:
        steps:
          - copy: twinfile/event/volcanic-ash:1.0.0
        args:
          ashfallAt: volcanic-ash.ashfall
