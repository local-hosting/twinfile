twinfile: 2
kind: story
id: river-resilience
name: River resilience
version: 0.1.0
stability: example
mode: resilience
links:
  - rel: involves
    href: twinfile/place/river:0.2.0
  - rel: involves
    href: twinfile/character/river-guide:0.1.0
  - rel: involves
    href: twinfile/context/river-patrol:0.1.0
story:
  pitch: Dam-release swim and stage watches, flood crest, then drought restriction.
  scenes:
    - id: swim-unsafe-known
      label: Swim unsafe after release
      run:
        steps:
          - copy: twinfile/event/dam-release:1.0.0
        clock:
          starts_at: 2026-06-12T09:00:00-04:00
          duration: PT6H
          step: PT5M
        args:
          track: turbidity
          threshold: 50
    - id: until-stage-unsafe
      label: Upstream stage unsafe
      run:
        steps:
          - copy: twinfile/event/dam-release:1.0.0
        clock:
          starts_at: 2026-06-12T09:00:00-04:00
          duration: PT30M
          step: PT1M
        args:
          track: stage
          threshold: 10
    - id: reach-flood
      label: Reach flood crest
      run:
        steps:
          - copy: twinfile/event/flood:1.0.0
        args:
          crestAt: flood.crest
    - id: reach-drought
      label: Reach drought restriction
      run:
        steps:
          - copy: twinfile/event/drought:1.0.0
        args:
          restrictionAt: drought.restriction
