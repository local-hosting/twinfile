specVersion: "1.0"
methodId: general-daily
jobs:
  - id: manage-daily-life
    label: Manage daily life
    granularity: theme
    context: When I am out running routine personal tasks
    goal: keep my week moving without unnecessary trips or delays
    outcome: Daily tasks are done and I stay on schedule
    visitationGoal: converge
    visitationSubGoal: visit
    heartDimensionId: taskSuccess
  - id: run-weekly-errands
    label: Run weekly errands
    granularity: theme
    context: When I need to restock essentials or finish routine tasks while out
    goal: get what I need without wasting time or money
    outcome: I finish my errands with minimal friction
    visitationGoal: converge
    visitationSubGoal: visit
    heartDimensionId: taskSuccess
  - id: stock-up-pantry
    label: Stock up pantry
    granularity: story
    parentJobId: run-weekly-errands
    context: When I am doing a larger grocery run for the week
    goal: buy enough staples to avoid extra trips
    outcome: My pantry is stocked for the week ahead
    visitationGoal: converge
    visitationSubGoal: visit
  - id: pick-up-essentials
    label: Pick up essentials
    granularity: story
    parentJobId: run-weekly-errands
    context: When I need a quick top-up between major shopping trips
    goal: grab a few items without a full outing
    outcome: I get what I came for in one short stop
    visitationGoal: converge
    visitationSubGoal: visit
  - id: refuel-and-go
    label: Refuel and go
    granularity: story
    parentJobId: manage-daily-life
    context: When I am driving between stops
    goal: fill up quickly and keep moving
    outcome: I am back on the road with minimal delay
    visitationGoal: converge
    visitationSubGoal: visit
  - id: handle-banking-errand
    label: Handle banking errand
    granularity: story
    parentJobId: manage-daily-life
    context: When I need to deposit, withdraw, or resolve an account task
    goal: complete banking without a separate trip later
    outcome: My banking task is done in one visit
    visitationGoal: converge
    visitationSubGoal: visit
  - id: ship-or-pick-up-parcel
    label: Ship or pick up parcel
    granularity: story
    parentJobId: run-weekly-errands
    context: When I have a package to send or collect
    goal: finish the shipping task while I am already out
    outcome: The parcel is sent or in my hands
    visitationGoal: converge
    visitationSubGoal: visit
  - id: fill-prescription
    label: Fill prescription
    granularity: story
    parentJobId: manage-daily-life
    context: When I or someone I care for needs medication
    goal: pick up the prescription reliably and on time
    outcome: I leave with the correct medication
    visitationGoal: converge
    visitationSubGoal: visit
    heartDimensionId: taskSuccess
  - id: grab-meal
    label: Grab a meal
    granularity: story
    parentJobId: manage-daily-life
    context: When my outing spans a meal window
    goal: eat without derailing the rest of my plan
    outcome: I refuel and continue on schedule
    visitationGoal: converge
    visitationSubGoal: visit
  - id: take-break
    label: Take a break
    granularity: story
    parentJobId: manage-daily-life
    context: When a long day needs a pause
    goal: rest before the next leg
    outcome: I feel recharged enough to continue
    visitationGoal: consume
    visitationSubGoal: visit
  - id: stay-active
    label: Stay active
    granularity: story
    parentJobId: manage-daily-life
    context: When I am maintaining a fitness routine
    goal: complete a workout as part of my weekly plan
    outcome: I finish my session and stay on track
    visitationGoal: consume
    visitationSubGoal: learn
