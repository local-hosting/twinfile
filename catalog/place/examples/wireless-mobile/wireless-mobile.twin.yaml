from: twinfile/place/physical-store:0.1.0
twinfile: 2
kind: place
id: wireless-mobile
name: Example wireless and mobile store
version: 0.1.0
stability: example
geotype:
  primary: shopping_mall
  registry: "@doppler-group/geotypes@0.2.0"
steps:
  - place:
      name: Example wireless and mobile store
      kind: shop
      timezone: America/Chicago
      published: false
      ext:
        lat: 41.881832
        lon: -87.623177
        h3: 89266da62c7ffff
  - assets:
      - id: greeter-kiosk
        kind: kiosk
        dtpr:
          schema: dtpr@2026-09-01-beta
          type: device
          accountable: example-carrier
          elements:
            purpose:
              - commerce
            manifestation:
              - chatbot_voice_reply
            affected:
              - people
      - id: queue-display
        kind: display
        dtpr:
          schema: dtpr@2026-09-01-beta
          type: device
          accountable: example-carrier
          elements:
            purpose:
              - commerce
            manifestation:
              - informational_display
            affected:
              - people
      - id: pay-station
        kind: pos
        dtpr:
          schema: dtpr@2026-09-01-beta
          type: device
          accountable: example-carrier
          elements:
            purpose:
              - commerce
            manifestation:
              - automatic_transaction
            affected:
              - people
  - sensors:
      - id: entrance-counter
        observes: door-main
        unit: entries_per_hour
        dtpr:
          schema: dtpr@2026-09-01-beta
          type: device
          accountable: example-carrier
          elements:
            collection:
              - connected_device_telemetry
            purpose:
              - entry
            affected:
              - people
  - ai:
      - id: greeter-assistant
        name: Greeter assistant
        kind: conversational
        runs_on: on-device
        space: welcome-desk
        accountable: example-carrier
        dtpr:
          schema: dtpr@2026-09-01-beta
          type: ai
          accountable: example-carrier
          elements:
            processing:
              - classification_prediction
            manifestation:
              - chatbot_voice_reply
            affected:
              - people