from: twinfile/base-linear:0.1.0
twinfile: 2
kind: place
id: river
name: Tellico River
version: 0.2.0
stability: example
geotype:
  primary: creek
  registry: "@doppler-group/geotypes@0.1.2"
steps:
  - place:
      name: Tellico River
      kind: creek
      timezone: America/New_York
      location:
        lat: 35.4197
        lng: -84.2578
      ext:
        h3: 8944c842e17ffff
      published: false
  - spaces:
      - id: reach-upper
        name: Upper reach
        kind: reach
        exposure: outdoor
        visit_order: 2
      - id: eddy-pool
        name: Eddy pool
        kind: pool
        exposure: outdoor
        visit_order: 3
  - reaches:
      - id: reach-upper
        length_m: 1200
        flows_to: eddy-pool
      - id: eddy-pool
        length_m: 80
        flows_to: below-eddy
  - markers:
      - id: launch-ramp
        name: Boat launch
        roles:
          - water-launch
        step_free: true
        state: open
      - id: levee-top
        name: Levee overlook
        roles:
          - flood-refuge
        step_free: false
        state: open
  - gauges:
      - id: gauge-upstream
        observes: stage
        feed:
          protocol: file
          url: sources/gauges/upstream.jsonl
        roles:
          - gauge
  - sensors:
      - id: sonde-eddy-pool
        name: Eddy pool water quality probe
        observes: eddy-pool
        space: eddy-pool
        unit: NTU
        properties:
          - turbidity
        simulate:
          every: PT15M
          uplink: PT1H
          turbidity:
            baseline: 8
            noise: 0
            response:
              phase: release
              peak: 116
              rise: PT2H
              decay: PT3H
        dtpr:
          schema: dtpr@2026-09-01-beta
          type: device
          accountable: example-watershed-district
          elements:
            collection:
              - connected_device_telemetry
            purpose:
              - public_safety
            affected:
              - environment
      - id: lab-eddy-pool
        name: Eddy pool bacteria grab samples
        observes: eddy-pool
        space: eddy-pool
        properties:
          - ecoli
        feed:
          protocol: file
          url: sources/lab/eddy-pool.jsonl
  - routes:
      - id: reach-eddy
        name: Upper reach to eddy
        from: reach-upper
        to: eddy-pool
        length_m: 1200
        kind: path
        step_free: false
  - assets:
      - id: gauge-telemetry
        name: Stage gauge telemetry
        kind: sensor
        space: reach-upper
        state: active
  - schedules:
      - id: ecoli-grab-sample
        name: Bacteria grab sample at the eddy pool
        when: Tu,Fr 08:00-08:30
        activeWhen:
          track: daylight
          min: 0
        uses:
          space: eddy-pool
  - visits:
      - id: visit-eddy-sample
        kind: activity
        name: Grab sample at eddy pool
        space: eddy-pool
        order: 0
        during: ecoli-grab-sample
  - tracks:
      - id: stage
        source: feed
        device: gauge-upstream
        property: stage
        unit: m
        interpolate: linear
      - id: turbidity
        source: feed
        device: sonde-eddy-pool
        property: turbidity
        unit: NTU
        interpolate: linear
      - id: ecoli
        source: feed
        device: lab-eddy-pool
        property: ecoli
        unit: CFU/100mL
        interpolate: step
      - id: sampling
        source: schedule
        schedule: ecoli-grab-sample
      - id: daylight
        source: solar
        unit: deg
  - bind:
      for: dam-release
      roles:
        water-launch:
          - launch-ramp
        flood-refuge:
          - levee-top
        gauge:
          - gauge-upstream
      actions:
        - at: release
          set:
            launch-ramp:
              state: closed
