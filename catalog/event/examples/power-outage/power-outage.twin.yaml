twinfile: 1
kind: event
id: power-outage
name: Power outage
version: 1.0.0
stability: stable
phases:
  - outage
  - partial-restore
  - restored
expects:
  shelter:
    kind: space
    min: 1
  safe-access:
    kind: marker
    min: 1
  alternative:
    kind: space
    min: 0
  survey-station:
    kind: station
    min: 0
args:
  outageAt:
    type: time
