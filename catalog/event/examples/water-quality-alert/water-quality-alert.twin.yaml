twinfile: 1
kind: event
id: water-quality-alert
name: Water quality alert
version: 1.0.0
stability: example
mode: resilience
phases:
  - watch
  - exceedance
  - advisory-lifted
expects:
  hotspot:
    kind: marker
    min: 1
  safe-access:
    kind: marker
    min: 1
  collection-point:
    kind: marker
    min: 1
  survey-station:
    kind: station
    min: 1
args:
  exceedanceAt:
    type: time
  threshold:
    type: number
