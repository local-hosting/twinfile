role: run
from: twinfile/place/arena:1.2.0
id: arena-gate-open-ramp
name: Gate open ramp
version: 1.0.0
stability: example
steps:
  - copy: twinfile/event/arena-game-day:1.0.0
  - copy: twinfile/event/venue-turnstile-flow:1.0.0
domains:
  - events
schedule:
  arena-game-day:
    gates-open: -PT1H30M
    kickoff: PT0S
    halftime: PT1H5M
    final: PT2H20M
args:
