twinfile: 2
kind: story
id: tennessee-river-resilience
name: Tennessee River resilience
version: 0.1.0
stability: example
mode: resilience
links:
  - rel: involves
    href: twinfile/place/tennessee-river:0.1.0
  - rel: involves
    href: twinfile/place/aquarium-conservation:0.1.0
  - rel: involves
    href: twinfile/place/red-bank-high:0.1.0
  - rel: involves
    href: twinfile/place/normal-park:0.1.0
  - rel: involves
    href: twinfile/character/watershed-steward:0.1.0
  - rel: involves
