# When [Context/Circumstance], I want to [Goal/Job], so I can [Outcome/Need] without [Obstacle].
label: Watershed monitor round
context: When I am monitoring water quality along a river confluence corridor
jobs:
  - id: complete-confluence-round
    text: Complete confluence round
    context: When a clear-day monitor circuit is due
    goal: sample and observe from creek through island reaches
    outcome: The round is logged with consistent sites
  - id: handoff-school-sample
    text: Hand off school sample
    context: When a school partner needs a sample transfer
    goal: deliver the sample with chain-of-custody clear
    outcome: The school receives a usable sample
  - id: handoff-aquarium-sample
    text: Hand off aquarium sample
    context: When conservation partners need a quality sample
    goal: complete the aquarium handoff without gaps
    outcome: Partners can act on current water-quality data
