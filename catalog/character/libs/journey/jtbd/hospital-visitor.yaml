specVersion: "1.0"
methodId: hospital-visit
jobs:
  - id: support-loved-one
    label: Support loved one
    granularity: theme
    context: When someone I care about is in the hospital
    goal: be present, informed, and helpful during their stay
    outcome: They feel supported and I understand the care plan
    visitationGoal: connect
    visitationSubGoal: friends
    heartDimensionId: happiness
  - id: find-way-to-department
    label: Find way to department
    granularity: story
    parentJobId: support-loved-one
    context: When the campus layout is unfamiliar
    goal: reach the correct wing or room without getting lost
    outcome: I arrive at the right place on the first try
    visitationGoal: converge
    visitationSubGoal: visit
    heartDimensionId: taskSuccess
  - id: wait-comfortably
    label: Wait comfortably
    granularity: story
    parentJobId: support-loved-one
    context: When procedures or visits run longer than expected
    goal: stay nearby without added stress
    outcome: I can wait without feeling stranded or anxious
    visitationGoal: converge
    visitationSubGoal: visit
