name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  twinfile:
    runs-on: ubuntu-latest
    env:
      TF_TWINFILE_ROOT: ${{ github.workspace }}
      TF_PLACE_CATALOG: ${{ github.workspace }}/catalog/place/examples
      TF_EXAMPLES_ROOT: ${{ github.workspace }}/catalog/place/examples
      NODE_AUTH_TOKEN: ${{ secrets.TF_PACKAGES_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout geotypes (sibling)
        uses: actions/checkout@v4
        with:
          repository: local-hosting/geotypes
          path: ../geotypes
          token: ${{ secrets.TF_PACKAGES_TOKEN || github.token }}

      - name: Checkout frameworks (sibling)
        uses: actions/checkout@v4
        with:
          repository: local-hosting/frameworks
          path: ../frameworks
          token: ${{ secrets.TF_PACKAGES_TOKEN || github.token }}

      - name: Checkout geokit (sibling)
        uses: actions/checkout@v4
        with:
          repository: local-hosting/geokit
          path: ../geokit
          token: ${{ secrets.TF_PACKAGES_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: corepack enable && corepack prepare yarn@4.9.2 --activate

      - name: Build linked frameworks (core + presets)
        working-directory: ../frameworks
        run: |
          corepack prepare yarn@4.14.1 --activate
          yarn install --no-immutable
          yarn workspace @local-hosting/frameworks-core run build
          yarn workspace @local-hosting/frameworks-presets run build

      - name: Install and build geotypes
        working-directory: ../geotypes
        run: |
          corepack prepare yarn@4.9.2 --activate
          yarn install --no-immutable
          yarn build

      - run: yarn install --no-immutable

      - run: yarn run check:twinfile