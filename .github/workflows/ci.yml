name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  twinfile:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.TF_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone sibling repositories (portal/link deps)
        env:
          GH_TOKEN: ${{ secrets.TF_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::Repo secret TF_PACKAGES_TOKEN is required (PAT with repo read on local-hosting/geotypes, geokit). See .github/README.md"
            exit 1
          fi
          parent="$(dirname "$GITHUB_WORKSPACE")"
          work_root="$(dirname "$parent")"
          for repo in geotypes geokit; do
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/local-hosting/${repo}.git" "${parent}/${repo}"
          done
          mkdir -p "${work_root}/westlane"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/westlane/isocanvas.git" "${work_root}/westlane/isocanvas"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: corepack enable && corepack prepare yarn@4.9.2 --activate

      - name: Install and build geotypes
        working-directory: ../geotypes
        run: |
          corepack prepare yarn@4.9.2 --activate
          yarn install --no-immutable
          yarn build

      - run: yarn install --no-immutable

      - name: Verify tracked src/build trees (gitignore regression guard)
        run: |
          test -f packages/core/src/build/merge.ts
          test -f catalog/story/src/contract/narrative/journey/build/build-journey.ts

      - run: yarn run check:twinfile