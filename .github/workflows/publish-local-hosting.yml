name: publish-local-hosting
on:
  workflow_dispatch:

jobs:
  npm-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@local-hosting'
      - run: corepack enable && yarn install --immutable
      - run: yarn workspace @local-hosting/twinfile build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.TF_PACKAGES_TOKEN }}
      - name: publish spec (smoke)
        run: yarn workspace @local-hosting/twinfile npm publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.TF_PACKAGES_TOKEN }}